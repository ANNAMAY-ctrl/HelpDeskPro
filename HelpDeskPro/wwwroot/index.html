<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpDesk Pro | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <h2> 🎫HelpDesk Pro</h2>
        <span> IT Support Managment</span>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Helpdesk Dashboard</h1>

            <p>
                Welcome to HelpDesk Pro.
                Manage and track IT support requests.
            </p>

        </section>

        <section class="stats">

            <div class="stat-card">
                <h3>Total Tickets</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Open Tickets</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <p>0</p>
            </div>

        </section>

        <section class="tickets">

            <div class="section-header">
                <h2>Support Tickets</h2>
                <button id="createTicketBtn">
                    + Create Ticket
                </button>
            </div>
            
            <p id="emptyMessage">
                No support tickets yet.
                Create your first ticket to get started!
            </p>
    
        </section>

        <section id="ticketFormSection"
                 class="tickets-form" hidden>

            <h2> Create New Support Ticket </h2>

            <form id="ticketForm">
                <label for="fullName">Full Name</label>
                <input type="text"
                       id="fullName"
                       placeholder="Enter your full name"
                       required>


                <label for="issueTitle">Issue Title</label>
                <input type="text"
                       id="issueTitle"
                       placeholder="e.g. Wi-Fi not working"
                       required>

                <label for="Category">Category</label>
                <select id="Category" required>
                    <option value="">Select a category</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Network">Network</option>
                    <option value="Other">Other</option>
                </select>

                <label for="priority">Priority</label>
                <select id="priority" required>
                    <option value="">Select a priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="description">Description</label>
                <textarea id="description"
                             rows="5"
                          placeholder="Describe your problem..."
                          required></textarea>

                <div class="form-actions">


                    <button type="submit">
                        Submit Ticket
                    </button>

                    <button type="button"
                            id="cancelTicketBtn"
                            class="cancel-btn">
                        Cancel
                     </button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
