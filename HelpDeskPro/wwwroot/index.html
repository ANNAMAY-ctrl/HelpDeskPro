<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpDesk Pro | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <h2> 🎫HelpDesk Pro</h2>
        <span> IT Support Managment</span>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Helpdesk Dashboard</h1>

            <p>
                Welcome to HelpDesk Pro.
                Manage and track IT support requests.
            </p>

        </section>

        <section class="stats">

            <div class="stat-card">
                <h3>Total Tickets</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Open Tickets</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>In Progress</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <p>0</p>
            </div>

        </section>

        <section class="tickets">

            <div class="section-header">
                <h2>Support Tickets</h2>
                <button id="createTicketBtn">
                    + Create Ticket
                </button>
            </div>
            
            <p id="emptyMessage">
                No support tickets yet.
                Create your first ticket to get started!
            </p>
    
        </section>

    </main>

</body>
</html>
