<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpDesk Pro | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <h2> 🎫HelpDesk Pro</h2>
        <span>IT Support Managment</span>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Helpdesk Dashboard</h1>

            <p>
                Welcome to HelpDesk Pro.
                Manage and track IT support requests.
            </p>

        </section>


        <section class="stats">

            
            <div class="stat-card">
                <h3>Total Tickets</h3>
                <p id="totalTickets">0</p>
            </div>

            
            <div class="stat-card">
                <h3>Open Tickets</h3>
                <p id="openTickets">0</p>
            </div>

           
            <div class="stat-card">
                <h3>In Progress</h3>
                <p id="progressTickets">0</p>
            </div>

         
            <div class="stat-card">
                <h3>Resolved</h3>
                <p id="resolvedTickets">0</p>
            </div>

        </section>


        <section class="tickets">

            <div class="section-header">
                <h2>Support Tickets</h2>
                <button id="createTicketBtn">
                    + Create Ticket
                </button>
            </div>

            <p id="emptyMessage">
                No support tickets yet.
                Create your first ticket to get started!
            </p>

            <div id="ticketList"></div>

        </section>

        <section id="ticketFormSection"
                 class="ticket-form" hidden>

            <h2> Create New Support Ticket </h2>

            <form id="ticketForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text"
                           id="fullName"
                           placeholder="Enter your full name"
                           required>
                </div>

                <!-- Issue Title -->
                <div class="form-group">
                    <label for="issueTitle">Issue Title</label>
                    <input type="text"
                           id="issueTitle"
                           placeholder="e.g. Laptop won't connect to Wi-Fi"
                           required>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Software">Software</option>
                        <option value="Network">Network</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Priority -->
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" required>
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <!-- Description takes the full width -->
                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description"
                              rows="5"
                              placeholder="Describe your IT problem in detail..."
                              required></textarea>
                </div>

                <!-- Form buttons -->
                <div class="form-actions">
                    <button type="button"
                            id="cancelTicketBtn"
                            class="cancel-btn">
                        Cancel
                    </button>

                    <button type="submit">
                        Submit Ticket
                    </button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
